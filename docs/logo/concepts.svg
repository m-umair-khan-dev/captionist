<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1080" viewBox="0 0 1500 1080" font-family="Cantarell, Inter, sans-serif">
  <defs>
    <!-- ── App icons (128×128, GNOME style: tile + darker base edge) ── -->

    <!-- A: Speech bubble whose content is caption lines -->
    <g id="A">
      <rect x="8" y="16" width="112" height="104" rx="26" fill="#1a5fb4"/>
      <rect x="8" y="8" width="112" height="104" rx="26" fill="#3584e4"/>
      <path d="M32 28h64a12 12 0 0 1 12 12v30a12 12 0 0 1-12 12H58l-16 14V82H32a12 12 0 0 1-12-12V40a12 12 0 0 1 12-12z" fill="#fff"/>
      <rect x="34" y="42" width="60" height="9" rx="4.5" fill="#1a5fb4"/>
      <rect x="34" y="58" width="38" height="9" rx="4.5" fill="#99c1f1"/>
    </g>

    <!-- B: An ear shaped like the letter C, captions flowing out of it -->
    <g id="B">
      <rect x="8" y="16" width="112" height="104" rx="26" fill="#613583"/>
      <rect x="8" y="8" width="112" height="104" rx="26" fill="#9141ac"/>
      <path d="M74 34a28 28 0 1 0-6 52" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <path d="M62 50a12 12 0 0 0-14 18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <rect x="78" y="46" width="28" height="8" rx="4" fill="#f6d32d"/>
      <rect x="78" y="60" width="20" height="8" rx="4" fill="#f6d32d"/>
      <rect x="78" y="74" width="26" height="8" rx="4" fill="#f6d32d"/>
    </g>

    <!-- C: The caption window itself: one corrected line, one draft line + cursor -->
    <g id="C">
      <rect x="8" y="16" width="112" height="104" rx="26" fill="#c0bfbc"/>
      <rect x="8" y="8" width="112" height="104" rx="26" fill="#f6f5f4"/>
      <rect x="18" y="32" width="92" height="58" rx="14" fill="#241f31"/>
      <rect x="30" y="47" width="68" height="9" rx="4.5" fill="#fff"/>
      <rect x="30" y="65" width="40" height="9" rx="4.5" fill="#fff" opacity="0.45"/>
      <rect x="75" y="62" width="4" height="15" rx="2" fill="#f6d32d"/>
    </g>

    <!-- D: A sound wave turning into lines of text -->
    <g id="D">
      <rect x="8" y="16" width="112" height="104" rx="26" fill="#1c6b5a"/>
      <rect x="8" y="8" width="112" height="104" rx="26" fill="#2a9d84"/>
      <rect x="22" y="50" width="7" height="20" rx="3.5" fill="#fff"/>
      <rect x="33" y="38" width="7" height="44" rx="3.5" fill="#fff"/>
      <rect x="44" y="45" width="7" height="30" rx="3.5" fill="#fff"/>
      <rect x="58" y="42" width="48" height="9" rx="4.5" fill="#fff"/>
      <rect x="58" y="56" width="36" height="9" rx="4.5" fill="#fff" opacity="0.85"/>
      <rect x="58" y="70" width="44" height="9" rx="4.5" fill="#fff" opacity="0.7"/>
    </g>

    <!-- E: A bold C monogram with captions coming out of its opening -->
    <g id="E">
      <rect x="8" y="16" width="112" height="104" rx="26" fill="#c64600"/>
      <rect x="8" y="8" width="112" height="104" rx="26" fill="#ff7800"/>
      <path d="M86 38a30 30 0 1 0 0 44" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
      <rect x="58" y="46" width="48" height="8" rx="4" fill="#fff"/>
      <rect x="58" y="58" width="36" height="8" rx="4" fill="#ffe8cc"/>
      <rect x="58" y="70" width="44" height="8" rx="4" fill="#ffe8cc"/>
    </g>

    <!-- ── Symbolic (one-colour) top-bar icons, 16×16 grid ── -->
    <g id="sA" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2.5h10a1.5 1.5 0 0 1 1.5 1.5v5.5A1.5 1.5 0 0 1 13 11H7l-3 2.5V11H3A1.5 1.5 0 0 1 1.5 9.5V4A1.5 1.5 0 0 1 3 2.5z"/>
      <path d="M4.5 5.5h7M4.5 8h4"/>
    </g>
    <g id="sB" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <path d="M8.5 3.5A4.6 4.6 0 1 0 7.5 12.5"/>
      <path d="M10.5 6h3.5M10.5 8.5h2.5M10.5 11h3"/>
    </g>
    <g id="sC" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1.5" y="3" width="13" height="10" rx="2.5"/>
      <path d="M4.5 6.5h7"/>
      <path d="M4.5 9.5h3.5" opacity="0.6"/>
    </g>
    <g id="sD" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 6.5v3M4.5 4.5v7M7 5.5v5"/>
      <path d="M9.5 5.5h5M9.5 8h3.5M9.5 10.5h4.5"/>
    </g>
    <g id="sE" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M11 4.2A4.8 4.8 0 1 0 11 11.8"/>
      <path d="M8 6.5h6M8 9.5h4.5" stroke-width="1.6"/>
    </g>
  </defs>

  <rect width="1500" height="1080" fill="#fafafa"/>
  <text x="60" y="78" font-size="38" font-weight="700" fill="#1c1c1c">Captionist: logo concepts</text>
  <text x="60" y="114" font-size="19" fill="#5e5c64">Each concept: app icon · small sizes (64, 32 px) · one-colour top-bar icon</text>

  <!-- Concept cards: 3 on the first row, 2 on the second -->
  <!-- Card template: x offset per card; icon at (x+24, y+24) size 176 -->

  <!-- A -->
  <g transform="translate(60 150)">
    <rect width="440" height="420" rx="20" fill="#fff" stroke="#e0dfdc"/>
    <use xlink:href="#A" transform="translate(24 24) scale(1.375)"/>
    <use xlink:href="#A" transform="translate(228 40) scale(0.5)"/>
    <use xlink:href="#A" transform="translate(308 56) scale(0.25)"/>
    <rect x="228" y="130" width="188" height="54" rx="12" fill="#1d1d1d"/>
    <use xlink:href="#sA" transform="translate(244 145) scale(1.5)"/>
    <text x="282" y="164" font-size="17" fill="#fff">Captionist</text>
    <text x="24" y="250" font-size="26" font-weight="700" fill="#1c1c1c">A · Speech bubble</text>
    <text x="24" y="284" font-size="17" fill="#3d3846">A speech bubble whose words are</text>
    <text x="24" y="306" font-size="17" fill="#3d3846">caption lines: speech becomes text.</text>
    <text x="24" y="344" font-size="16" fill="#26a269">+ Instantly reads as "captions"</text>
    <text x="24" y="368" font-size="16" fill="#c01c28">− Common in chat apps</text>
  </g>

  <!-- B -->
  <g transform="translate(530 150)">
    <rect width="440" height="420" rx="20" fill="#fff" stroke="#e0dfdc"/>
    <use xlink:href="#B" transform="translate(24 24) scale(1.375)"/>
    <use xlink:href="#B" transform="translate(228 40) scale(0.5)"/>
    <use xlink:href="#B" transform="translate(308 56) scale(0.25)"/>
    <rect x="228" y="130" width="188" height="54" rx="12" fill="#1d1d1d"/>
    <use xlink:href="#sB" transform="translate(244 145) scale(1.5)"/>
    <text x="282" y="164" font-size="17" fill="#fff">Captionist</text>
    <text x="24" y="250" font-size="26" font-weight="700" fill="#1c1c1c">B · Ear-C</text>
    <text x="24" y="284" font-size="17" fill="#3d3846">An ear that is also the letter C,</text>
    <text x="24" y="306" font-size="17" fill="#3d3846">with captions flowing out of it.</text>
    <text x="24" y="344" font-size="16" fill="#26a269">+ Hearing + Captionist "C" in one mark</text>
    <text x="24" y="368" font-size="16" fill="#c01c28">− Ear is subtle at very small sizes</text>
  </g>

  <!-- C -->
  <g transform="translate(1000 150)">
    <rect width="440" height="420" rx="20" fill="#fff" stroke="#e0dfdc"/>
    <use xlink:href="#C" transform="translate(24 24) scale(1.375)"/>
    <use xlink:href="#C" transform="translate(228 40) scale(0.5)"/>
    <use xlink:href="#C" transform="translate(308 56) scale(0.25)"/>
    <rect x="228" y="130" width="188" height="54" rx="12" fill="#1d1d1d"/>
    <use xlink:href="#sC" transform="translate(244 145) scale(1.5)"/>
    <text x="282" y="164" font-size="17" fill="#fff">Captionist</text>
    <text x="24" y="250" font-size="26" font-weight="700" fill="#1c1c1c">C · Caption window</text>
    <text x="24" y="284" font-size="17" fill="#3d3846">The app's own caption box: a corrected</text>
    <text x="24" y="306" font-size="17" fill="#3d3846">line and a dimmed draft with a cursor.</text>
    <text x="24" y="344" font-size="16" fill="#26a269">+ Shows the two-pass idea; matches the UI</text>
    <text x="24" y="368" font-size="16" fill="#c01c28">− Plain; light tile is quiet in the grid</text>
  </g>

  <!-- D -->
  <g transform="translate(295 600)">
    <rect width="440" height="420" rx="20" fill="#fff" stroke="#e0dfdc"/>
    <use xlink:href="#D" transform="translate(24 24) scale(1.375)"/>
    <use xlink:href="#D" transform="translate(228 40) scale(0.5)"/>
    <use xlink:href="#D" transform="translate(308 56) scale(0.25)"/>
    <rect x="228" y="130" width="188" height="54" rx="12" fill="#1d1d1d"/>
    <use xlink:href="#sD" transform="translate(244 145) scale(1.5)"/>
    <text x="282" y="164" font-size="17" fill="#fff">Captionist</text>
    <text x="24" y="250" font-size="26" font-weight="700" fill="#1c1c1c">D · Wave to words</text>
    <text x="24" y="284" font-size="17" fill="#3d3846">A sound wave that turns into lines</text>
    <text x="24" y="306" font-size="17" fill="#3d3846">of text: exactly what the app does.</text>
    <text x="24" y="344" font-size="16" fill="#26a269">+ Clear story; very legible when small</text>
    <text x="24" y="368" font-size="16" fill="#c01c28">− Similar to audio/podcast apps</text>
  </g>

  <!-- E -->
  <g transform="translate(765 600)">
    <rect width="440" height="420" rx="20" fill="#fff" stroke="#e0dfdc"/>
    <use xlink:href="#E" transform="translate(24 24) scale(1.375)"/>
    <use xlink:href="#E" transform="translate(228 40) scale(0.5)"/>
    <use xlink:href="#E" transform="translate(308 56) scale(0.25)"/>
    <rect x="228" y="130" width="188" height="54" rx="12" fill="#1d1d1d"/>
    <use xlink:href="#sE" transform="translate(244 145) scale(1.5)"/>
    <text x="282" y="164" font-size="17" fill="#fff">Captionist</text>
    <text x="24" y="250" font-size="26" font-weight="700" fill="#1c1c1c">E · C monogram</text>
    <text x="24" y="284" font-size="17" fill="#3d3846">A bold "C" with caption lines</text>
    <text x="24" y="306" font-size="17" fill="#3d3846">coming out of its opening.</text>
    <text x="24" y="344" font-size="16" fill="#26a269">+ Strong brand mark; stands out in the grid</text>
    <text x="24" y="368" font-size="16" fill="#c01c28">− Less obvious what it does at first glance</text>
  </g>
</svg>
