name: Feature request
description: Suggest an idea or improvement
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing, rather than a specific solution.
      placeholder: "When I watch lectures, I'd like to save captions automatically to a file per lecture."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Captionist help?
      description: Your idea for how it could work (optional).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Other apps or workarounds (optional).
