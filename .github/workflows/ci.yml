name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build
      - name: Upload .deb (download it from the run's summary to test a PR)
        uses: actions/upload-artifact@v7
        with:
          name: captionist-deb
          path: dist/*.deb
          retention-days: 14

  compat:
    name: Works on Ubuntu ${{ matrix.ubuntu }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04", "26.10"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: captionist-deb
          path: dist
      # Install, libraries, caption service and the extension in GNOME Shell.
      # (The live-caption check needs downloaded speech models, so it runs locally only.)
      - name: Install and test the .deb
        run: DEB=$(ls dist/captionist_*_amd64.deb) scripts/compat-test.sh ${{ matrix.ubuntu }}

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the audit posts its findings as a check run
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
