[package]
name = "captionist"
description = "Captionist settings window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
captionist-core = { path = "../captionist-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Oldest supported: GTK 4.14 / libadwaita 1.5 (Ubuntu 24.04). Newer GTK runs it fine.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
