# Captionist model catalogue.
#
# role:   live   = pass 1, streaming draft text
#         refine = pass 2, re-reads each finished sentence
# rank:   fallback accuracy order (higher = more accurate) until wer_* is measured
# wer_*:  word error rate (%) on LibriSpeech test-clean / test-other,
#         measured with `captionist-bench eval` (lower = better).
#         Measured 2026-11-09: 60 utterances per set (Nemotron: 15), 2 threads.
# ref_*:  speed (RTF) and peak RAM on the reference PC (Intel N150, 2 threads).
#         Other PCs time the calibration model and scale these to estimate
#         speed without downloading every model.
#
# Adding a model = adding an entry here. No code changes needed.

# ───────────────────────────── Pass 1: live ─────────────────────────────

