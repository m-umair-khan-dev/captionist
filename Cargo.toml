[workspace]
resolver = "3"
members = ["crates/captionist-core", "crates/captionist-engine", "crates/captionist-bench", "crates/captionistd", "crates/captionist"]

[workspace.package]
version = "0.1.1" # x-release-please-version
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/m-umair-khan-dev/captionist"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
# Shared build of sherpa-onnx against ONNX Runtime 1.24.1 (scripts/build-sherpa.sh),
# so the runtime can be swapped for Intel's OpenVINO build at load time.
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
